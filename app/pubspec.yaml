name: perffoot
description: "A new Flutter project."
publish_to: 'none'
version: 0.3.2+7

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.5.2
  connectivity_plus: ^7.3.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  share_plus: ^13.3.1
  sqlite3: 3.5.2
  supabase_flutter: ^2.18.2
  uuid: ^4.6.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/club_crest.png
  # Titres « jeu de foot » : Barlow Condensed (licence OFL, assets/fonts/OFL.txt), embarquée pour le hors-ligne.
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
